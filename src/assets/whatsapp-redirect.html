<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Redirigiendo a WhatsApp...</title>
  <style>
    body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; background: #f0f2f5; }
    .loader { text-align: center; }
    .spinner { width: 40px; height: 40px; border: 4px solid #ccc; border-top-color: #25d366; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>Abriendo WhatsApp...</p>
  </div>
  <script>
    var params = new URLSearchParams(window.location.search);
    var phone = params.get('phone');
    var text = params.get('text');
    if (phone && text) {
      window.location.replace('https://web.whatsapp.com/send?phone=' + phone + '&text=' + text);
    }
  </script>
</body>
</html>
